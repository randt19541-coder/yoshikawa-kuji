<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>吉川さん宝箱くじ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#1a0f1f;
    --bg2:#2a1630;
    --ink:#fbeede;
    --muted:#c9b3c4;
    --line:#4a2d4f;
    --accent:#ff4f7b;
    --gold:#f5c04a; --gold-d:#b07d12;
    --silver:#d9dee6; --silver-d:#8a94a3;
    --bronze:#d9894f; --bronze-d:#8c4a1f;
    --wood:#6b3a22; --wood-d:#43210f;
    --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
    --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #4b1f45 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--body);
    font-size:15px;
  }
  .wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:flex;flex-direction:column;gap:22px}
  header{text-align:center;display:flex;flex-direction:column;gap:6px}
  .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:800}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1.15;margin:0;text-wrap:balance}
  h1 span{color:var(--gold)}
  .lead{color:var(--muted);margin:0;line-height:1.7}

  .name{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .name label{font-weight:800;font-size:14px}
  .name input{
    font:inherit;color:var(--ink);background:var(--bg2);border:1.5px solid var(--line);
    border-radius:10px;padding:8px 12px;width:12em;max-width:100%;
  }
  .name input:focus{outline:2px solid var(--accent);outline-offset:1px}

  .chests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .chest{
    appearance:none;border:0;background:none;padding:10px 4px 12px;cursor:pointer;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:16px;
    font:inherit;transition:transform .15s, background .2s;
  }
  .chest:hover:not(:disabled){transform:translateY(-3px);background:rgba(255,255,255,.04)}
  .chest:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chest:disabled{cursor:default}
  .chest svg{width:100%;max-width:130px;height:auto;overflow:visible}
  .chest .lbl{font-family:var(--display);font-size:clamp(15px,4.4vw,19px)}
  .chest.gold .lbl{color:var(--gold)}
  .chest.silver .lbl{color:var(--silver)}
  .chest.bronze .lbl{color:var(--bronze)}
  .chest .inside{
    font-size:12px;font-weight:800;line-height:1.45;min-height:3em;text-align:center;color:var(--muted);
  }
  .chest.picked .inside{color:var(--ink)}
  .chest.dim{opacity:.55}

  .lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
  .chest.open .lid{transform:translateY(-8px) rotate(-18deg)}
  .glow{opacity:0;transition:opacity .4s}
  .chest.open .glow{opacity:1}
  .chest.shake svg{animation:shake .5s ease-in-out 2}
  @keyframes shake{
    0%,100%{transform:rotate(0)}
    20%{transform:rotate(-6deg)} 40%{transform:rotate(5deg)}
    60%{transform:rotate(-4deg)} 80%{transform:rotate(3deg)}
  }

  .result{
    background:var(--bg2);border:1.5px solid var(--line);border-radius:18px;
    padding:20px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;
  }
  .result .who{color:var(--muted);font-size:13px;font-weight:800}
  .result .prize{font-family:var(--display);font-size:clamp(22px,6.5vw,30px);line-height:1.3;text-wrap:balance}
  .result.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .hint{color:var(--muted);text-align:center;margin:0;font-size:14px}
  .left{text-align:center;font-size:13px;font-weight:800;color:var(--muted);margin-top:6px}
  .left b{color:var(--accent);font-size:18px;font-variant-numeric:tabular-nums}
  .stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tiger{width:130px;height:auto;margin:2px auto -2px;display:block;overflow:visible}
  .tigermsg{font-family:var(--display);font-size:clamp(18px,5.5vw,24px);line-height:1.3}
  .result .prize{font-size:clamp(20px,6vw,27px)}
  .tg-bounce{transform-box:fill-box;transform-origin:50% 100%;animation:bounce .7s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.03)}}
  .tg-star{transform-box:fill-box;transform-origin:center;animation:twinkle 1s ease-in-out infinite}
  .tg-star2{transform-box:fill-box;transform-origin:center;animation:twinkle 1s ease-in-out .5s infinite}
  @keyframes twinkle{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  .tg-droop{transform-box:fill-box;transform-origin:50% 100%;animation:droop 2.4s ease-in-out infinite}
  @keyframes droop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(3px) rotate(-2deg)}}
  .tg-tearL,.tg-tearR{transform-box:fill-box;transform-origin:50% 0;animation:tear 1.8s ease-in-out infinite}
  .tg-tearR{animation-delay:.6s}
  @keyframes tear{0%{opacity:0;transform:translateY(-4px) scaleY(.6)}30%{opacity:.9}100%{opacity:0;transform:translateY(10px) scaleY(1.1)}}
  @media (prefers-reduced-motion: reduce){
    .tg-bounce,.tg-star,.tg-star2,.tg-droop,.tg-tearL,.tg-tearR{animation:none}
  }

  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{
    font:inherit;font-weight:800;border-radius:999px;padding:11px 20px;cursor:pointer;
    border:1.5px solid var(--line);background:transparent;color:var(--ink);
  }
  .btn.primary{background:#06c755;border-color:#06c755;color:#fff}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .toast{font-size:13px;color:#7ee2a4;min-height:1.2em}
  textarea.fallback{width:100%;font:inherit;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}

  footer{color:var(--muted);font-size:12px;text-align:center;line-height:1.7}
  .hype{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink)}
  .hype strong{font-family:var(--display);font-weight:400;font-size:clamp(17px,5vw,22px);color:var(--gold);animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.55;transform:scale(1.04)}}
  @media (prefers-reduced-motion: reduce){.hype strong{animation:none}}

  @media (prefers-reduced-motion: reduce){
    .lid,.chest,.glow{transition:none}
    .chest.shake svg,.result.pop{animation:none}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">TREASURE KUJI</div>
    <h1>ここで人生かえますか？<br><span>終わらせますか？</span></h1>
    <p class="lead">宝箱をひとつ選んでタップ。中身は毎回シャッフルされます。</p>
  </header>

  <div class="name">
    <label for="player">引く人</label>
    <input id="player" type="text" placeholder="名前を入れてね" maxlength="16" autocomplete="off">
  </div>

  <div class="chests" id="chests"></div>

  <div id="resultArea">
    <p class="hint" id="hint">金・銀・銅、どれにする？</p>
  </div>

  <footer class="hype">
    <strong>とっても素敵なプレゼント！めざせ当たりくじ！</strong>
    <span>チャンスは今この一回だけ。3つにひとつ、運命の宝箱があなたを待ってる！</span>
    <span>次の一箱で人生が変わるかも…？ 迷ってる間に、隣の人が先に当てちゃうぞ！</span>
  </footer>
</div>

<script>
(function(){
  const PRIZES = [
    {short:"焼肉", text:"吉川さんに焼肉をおごる", win:true},
    {short:"キャバクラ", text:"吉川さんにキャバクラをおごる", win:false},
    {short:"言う事5個", text:"吉川さんの言う事を5個聞く", win:false}
  ];
  const BOXES = [
    {key:"gold",   name:"金の宝箱", c:"var(--gold)",   d:"var(--gold-d)"},
    {key:"silver", name:"銀の宝箱", c:"var(--silver)", d:"var(--silver-d)"},
    {key:"bronze", name:"銅の宝箱", c:"var(--bronze)", d:"var(--bronze-d)"}
  ];

  const chestsEl = document.getElementById("chests");
  const resultArea = document.getElementById("resultArea");
  const player = document.getElementById("player");
  let assign = [], busy = false, done = false;

  try{ const n = localStorage.getItem("kuji-name"); if(n) player.value = n; }catch(e){}
  player.addEventListener("input", ()=>{ try{ localStorage.setItem("kuji-name", player.value); }catch(e){} });

  // 動作確認用の隠しリセット：URLに #reset を付けて開くと今日の回数がゼロに戻る
  if(location.hash.toLowerCase().indexOf("reset") !== -1){
    try{ localStorage.removeItem("kuji-daily"); }catch(e){}
    try{ history.replaceState(null, "", location.pathname); }catch(e){}
  }

  const DAILY_MAX = 3;
  function today(){
    const d = new Date();
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }
  function usedToday(){
    try{
      const s = JSON.parse(localStorage.getItem("kuji-daily") || "{}");
      return s.date === today() ? (s.count|0) : 0;
    }catch(e){ return 0; }
  }
  function addUse(){
    try{ localStorage.setItem("kuji-daily", JSON.stringify({date:today(), count:usedToday()+1})); }catch(e){}
  }
  function left(){ return Math.max(0, DAILY_MAX - usedToday()); }
  function leftBadge(){
    const n = left();
    return `<div class="left">今日の残り <b>${n}</b> / ${DAILY_MAX} 回</div>`;
  }

  function tigerSVG(win){
    if(win){
      // 喜んでいる虎
      return `
      <svg class="tiger" viewBox="0 0 140 130" aria-hidden="true">
        <g class="tg-bounce">
          <path d="M30 34 L20 14 L40 26Z M110 34 L120 14 L100 26Z" fill="#f59331" stroke="#b5610f" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M28 20 L23 20 M112 20 L117 20" stroke="#ffd08a" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="70" cy="62" rx="46" ry="42" fill="#f7a23c"/>
          <path d="M70 20 Q86 26 88 44 L82 44 Q80 30 70 26 Q60 30 58 44 L52 44 Q54 26 70 20Z" fill="#fff3e0"/>
          <path d="M70 24 V52 M46 34 Q40 44 42 56 M94 34 Q100 44 98 56 M30 66 Q22 66 20 72 M110 66 Q118 66 120 72" stroke="#3a2213" stroke-width="3" stroke-linecap="round" fill="none"/>
          <ellipse cx="70" cy="82" rx="30" ry="24" fill="#fff3e0"/>
          <path d="M52 62 Q57 55 63 61 M88 62 Q83 55 77 61" stroke="#3a2213" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <path d="M64 84 Q70 88 76 84" fill="none" stroke="#3a2213" stroke-width="2"/>
          <path d="M70 74 L66 80 Q70 84 74 80Z" fill="#e26d5c"/>
          <path d="M58 92 Q70 104 82 92" fill="none" stroke="#3a2213" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="46" cy="86" r="6" fill="#ff9db0" opacity=".7"/>
          <circle cx="94" cy="86" r="6" fill="#ff9db0" opacity=".7"/>
          <path d="M40 40 l3 6 l6 1 l-4.5 4 l1 6 l-5.5 -3 l-5.5 3 l1 -6 l-4.5 -4 l6 -1Z" fill="var(--gold)" class="tg-star"/>
          <path d="M104 46 l2.5 5 l5 1 l-3.7 3.3 l0.9 5 l-4.7 -2.5 l-4.7 2.5 l0.9 -5 l-3.7 -3.3 l5 -1Z" fill="var(--gold)" class="tg-star2"/>
        </g>
      </svg>`;
    }
    // 泣いて落ち込んでいる虎
    return `
      <svg class="tiger" viewBox="0 0 140 130" aria-hidden="true">
        <g class="tg-droop">
          <path d="M30 40 L20 22 L40 32Z M110 40 L120 22 L100 32Z" fill="#c98a53" stroke="#8a5a2a" stroke-width="2.5" stroke-linejoin="round"/>
          <ellipse cx="70" cy="66" rx="46" ry="42" fill="#d9a066"/>
          <path d="M70 24 Q86 30 88 48 L82 48 Q80 34 70 30 Q60 34 58 48 L52 48 Q54 30 70 24Z" fill="#f3ead9"/>
          <path d="M70 28 V56 M46 38 Q40 48 42 60 M94 38 Q100 48 98 60 M30 70 Q22 70 20 76 M110 70 Q118 70 120 76" stroke="#4a3423" stroke-width="3" stroke-linecap="round" fill="none"/>
          <ellipse cx="70" cy="86" rx="30" ry="24" fill="#f3ead9"/>
          <path d="M50 60 Q56 66 62 62 M90 60 Q84 66 78 62" stroke="#4a3423" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <path d="M56 66 Q57 78 55 92 Q53 100 58 102 Q62 100 60 90 Q60 78 60 68Z" fill="#7ec8f0" opacity=".85" class="tg-tearL"/>
          <path d="M84 66 Q83 78 85 92 Q87 100 82 102 Q78 100 80 90 Q80 78 80 68Z" fill="#7ec8f0" opacity=".85" class="tg-tearR"/>
          <path d="M70 78 L66 84 Q70 88 74 84Z" fill="#c96b5c"/>
          <path d="M60 98 Q70 90 80 98" fill="none" stroke="#4a3423" stroke-width="3.5" stroke-linecap="round"/>
        </g>
      </svg>`;
  }

  function shuffle(a){
    const arr = a.slice();
    for(let i=arr.length-1;i>0;i--){
      const r = new Uint32Array(1); crypto.getRandomValues(r);
      const j = r[0] % (i+1);
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function chestSVG(b){
    return `
    <svg viewBox="0 0 120 100" aria-hidden="true">
      <g class="glow">
        <ellipse cx="60" cy="48" rx="46" ry="26" fill="${b.c}" opacity=".35"/>
        <path d="M60 10 L63 22 L60 34 L57 22Z M38 18 L46 28 L40 30Z M82 18 L74 28 L80 30Z" fill="${b.c}"/>
      </g>
      <rect x="14" y="50" width="92" height="44" rx="6" fill="var(--wood)"/>
      <rect x="14" y="50" width="92" height="44" rx="6" fill="none" stroke="var(--wood-d)" stroke-width="3"/>
      <rect x="14" y="66" width="92" height="7" fill="${b.c}"/>
      <rect x="22" y="50" width="9" height="44" fill="${b.c}"/>
      <rect x="89" y="50" width="9" height="44" fill="${b.c}"/>
      <g class="lid">
        <path d="M14 52 V38 Q14 18 60 18 Q106 18 106 38 V52 Z" fill="var(--wood)" stroke="var(--wood-d)" stroke-width="3"/>
        <path d="M22 51 V36 Q22 22 30 20 L31 51Z" fill="${b.c}"/>
        <path d="M98 51 V36 Q98 22 90 20 L89 51Z" fill="${b.c}"/>
        <rect x="14" y="44" width="92" height="7" fill="${b.c}"/>
      </g>
      <rect x="51" y="58" width="18" height="20" rx="3" fill="${b.c}" stroke="${b.d}" stroke-width="2"/>
      <circle cx="60" cy="66" r="3" fill="${b.d}"/>
      <rect x="58.5" y="67" width="3" height="6" fill="${b.d}"/>
    </svg>`;
  }

  function reset(){
    assign = shuffle(PRIZES);
    busy = false; done = false;
    chestsEl.innerHTML = "";
    BOXES.forEach((b,i)=>{
      const btn = document.createElement("button");
      btn.type = "button";
      btn.id = "chest-"+b.key;
      btn.className = "chest "+b.key;
      btn.setAttribute("aria-label", b.name+"を開ける");
      btn.innerHTML = chestSVG(b) + `<span class="lbl">${b.name}</span><span class="inside">？？？</span>`;
      btn.addEventListener("click", ()=>pick(i));
      chestsEl.appendChild(btn);
    });
    if(left() <= 0){
      [...chestsEl.children].forEach(b=>{ b.disabled = true; b.classList.add("dim"); });
      resultArea.innerHTML = '<div class="result"><div class="prize">今日の3回は使い切りました</div><div class="who">また明日、運命に挑んでね！</div></div>';
    }else{
      resultArea.innerHTML = '<p class="hint">金・銀・銅、どれにする？</p>' + leftBadge();
    }
  }

  function stamp(){
    const d = new Date();
    const p = n=>String(n).padStart(2,"0");
    return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  let drawTime = "";

  function pick(i){
    if(busy || done || left() <= 0) return;
    busy = true;
    drawTime = stamp();
    addUse();
    const btns = [...chestsEl.children];
    btns.forEach(b=>b.disabled = true);
    const el = btns[i];
    el.classList.add("shake");
    setTimeout(()=>{
      el.classList.remove("shake");
      el.classList.add("open","picked");
      el.querySelector(".inside").textContent = assign[i].text;
      // 選ばなかった箱は中身を見せない（閉じたまま・薄く表示）
      btns.forEach((b,k)=>{ if(k!==i){ b.classList.add("dim"); b.querySelector(".inside").textContent = "？？？"; } });
      showResult(i);
      done = true; busy = false;
    }, 1000);
  }

  function lineText(i){
    const who = player.value.trim();
    const name = who ? `${who}さん` : "（名前なし）";
    return `【吉川さん宝箱くじ】\n引いた人：${name}\n引いた時間：${drawTime}\n${BOXES[i].name} を開けたら…\n👉 ${assign[i].text}！`;
  }

  function showResult(i){
    const who = player.value.trim();
    resultArea.innerHTML = `
      <div class="result pop">
        <div class="who">${who ? escapeHTML(who)+"さんの" : ""}${BOXES[i].name}の中身は…</div>
        ${tigerSVG(assign[i].win)}
        <div class="tigermsg">${assign[i].win ? "やったー！大当たり！🎉" : "ざんねん…😭"}</div>
        <div class="prize">${assign[i].text}！</div>
        <div class="stamp">引いた人：${who ? escapeHTML(who)+"さん" : "（名前なし）"} ／ ${drawTime}</div>
        <div class="btns">
          <button class="btn primary" type="button" id="copyBtn">結果をコピーしてLINEに貼る</button>
          ${left() > 0 ? '<button class="btn" type="button" id="againBtn">もう一回</button>' : ''}
        </div>
        ${left() > 0 ? leftBadge() : '<div class="left">今日の3回はこれで終わり。また明日！</div>'}
        <div class="toast" id="toast" aria-live="polite"></div>
      </div>`;
    const again = document.getElementById("againBtn");
    if(again) again.addEventListener("click", reset);
    document.getElementById("copyBtn").addEventListener("click", ()=>{
      const t = lineText(i);
      const toast = document.getElementById("toast");
      const fallback = ()=>{
        toast.textContent = "下の文字を長押ししてコピーしてね";
        if(!document.getElementById("fb")){
          const ta = document.createElement("textarea");
          ta.id = "fb"; ta.className = "fallback"; ta.rows = 4; ta.readOnly = true; ta.value = t;
          toast.after(ta); ta.select();
        }
      };
      try{
        navigator.clipboard.writeText(t).then(()=>{ toast.textContent = "コピーしました。LINEのトークに貼り付けてね"; }, fallback);
      }catch(e){ fallback(); }
    });
  }

  function escapeHTML(s){ return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  reset();
})();
</script>
</body>
</html>
